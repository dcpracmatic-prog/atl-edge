services:
  atl-edge:
    build: .
    image: atl-edge:hardened
    ports:
      - "8787:8787"
    volumes:
      - atl-data:/data
    environment:
      PYTHONPATH: /app/vendor:/app
      ATL_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "from src.long_lived_protection import is_available; assert is_available()"]
      interval: 30s
      timeout: 5s
      retries: 3

  testbench:
    build: .
    image: atl-edge:hardened
    profiles: ["test"]
    working_dir: /app
    environment:
      PYTHONPATH: /app/vendor:/app
    command: ["python", "testbench/run_testbench.py", "--require-full", "--json", "/tmp/last_report.json"]

  bench:
    build: .
    image: atl-edge:hardened
    profiles: ["bench"]
    working_dir: /app
    environment:
      PYTHONPATH: /app/vendor:/app
    command: ["python", "testbench/perf_dossier.py", "--out", "/tmp/perf_report.md"]

volumes:
  atl-data:
